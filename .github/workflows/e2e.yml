name: E2E Tests (Playwright)

# Trigger: push ke branch main/master, setiap PR ke main, atau manual
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E — Laravel
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB:       gymin_test
          POSTGRES_USER:     gymin
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, mbstring, xml, bcmath
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Install @types/node
        run: npm install --save-dev @types/node@22
      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i 's|^DB_CONNECTION=.*|DB_CONNECTION=pgsql|'      .env
          sed -i 's|^# DB_HOST=.*|DB_HOST=127.0.0.1|'           .env
          sed -i 's|^# DB_PORT=.*|DB_PORT=5432|'                 .env
          sed -i 's|^# DB_DATABASE=.*|DB_DATABASE=gymin_test|'   .env
          sed -i 's|^# DB_USERNAME=.*|DB_USERNAME=gymin|'        .env
          sed -i 's|^# DB_PASSWORD=.*|DB_PASSWORD=secret|'       .env
          php artisan key:generate

      - name: Run migrations & seeders
        run: php artisan migrate --force && php artisan db:seed --force

      - name: Build Vite assets
        run: npm run build

      - name: Start Laravel server
        run: php artisan serve --host=127.0.0.1 --port=8000 &
        env:
          APP_ENV: testing

        run: |
          for i in $(seq 1 15); do
            curl -sf http://127.0.0.1:8000 > /dev/null && echo "Server ready" && break
            echo "Waiting... ($i)"
            sleep 2
          done

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          BASE_URL: http://127.0.0.1:8000
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
