name: E2E Tests (Playwright)

# Trigger: push ke branch main/master, setiap PR ke main, atau manual
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E — Laravel
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB:       gymin_test
          POSTGRES_USER:     gymin
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1. Checkout kode
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup PHP 8.3
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, mbstring, xml, bcmath
          coverage: none

      # 3. Cache Composer
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # 4. Install Composer packages
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # 5. Setup Node.js 22
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 6. Install npm packages
      - name: Install Node dependencies
        run: npm ci

      # 7. Install Playwright Chromium
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # 8. Siapkan .env untuk CI
      - name: Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate
          # Timpa DB config dengan nilai CI — printf agar tidak ada masalah indentasi
          printf '\nDB_CONNECTION=pgsql\nDB_HOST=127.0.0.1\nDB_PORT=5432\nDB_DATABASE=gymin_test\nDB_USERNAME=gymin\nDB_PASSWORD=secret\n' >> .env

      # 9. Jalankan migration + seeder
      - name: Run migrations & seeders
        run: php artisan migrate --force && php artisan db:seed --force

      # 10. Build frontend assets
      - name: Build Vite assets
        run: npm run build

      # 11. Jalankan Laravel dev server di background
      - name: Start Laravel server
        run: php artisan serve --host=127.0.0.1 --port=8000 &

      # 12. Tunggu server siap
      - name: Wait for server
        run: |
          for i in $(seq 1 15); do
            curl -sf http://127.0.0.1:8000 > /dev/null && echo "Server ready" && break
            echo "Waiting... ($i)"
            sleep 2
          done

      # 13. Jalankan Playwright E2E tests
      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          BASE_URL: http://127.0.0.1:8000
          CI: "true"

      # 14. Upload laporan HTML sebagai artefak (selalu, biar bisa dilihat saat gagal)
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
